<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fasia Verse Â· V0.15.00 Â· MESTRE DEL PRISMA</title>
<style>
:root{--bg:#f5f3ef;--card:#fff;--text:#17192b;--muted:#6d7280;--accent:#5b4ce0;--border:#ddd9d2;--ok:#22c55e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
body{overflow-x:hidden}
button,input{font:inherit}
.app{min-height:100vh}
.screen{display:none;min-height:100vh;padding:28px}
.screen.active{display:flex;flex-direction:column;justify-content:center}
.inner{width:min(1180px,100%);margin:auto}
.hero,.card{background:var(--card);border:2px solid var(--border);border-radius:26px;padding:24px}
.hero{background:linear-gradient(135deg,#f0edff,#fff9ef)}
.big{font-size:36px;font-weight:900;margin:0 0 8px}
.muted{color:var(--muted)}
.center{text-align:center}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.grid2{grid-template-columns:repeat(2,1fr)}
.grid3{grid-template-columns:repeat(3,1fr)}
.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:900;cursor:pointer;background:var(--accent);color:#fff}
.btn.secondary{background:#fff;color:var(--text);border:2px solid var(--border)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.code{width:100%;padding:18px;border:3px solid var(--border);border-radius:18px;font-size:30px;font-weight:900;text-align:center;text-transform:uppercase;letter-spacing:.15em;background:#fff}
.topic{cursor:pointer;min-height:135px}
.topic.active{border-color:var(--accent);background:#f0edff}
.chip{display:inline-block;padding:7px 12px;border-radius:999px;background:#ece9ff;font-weight:900}
.avatar-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.avatar-card{position:relative;border:4px solid transparent;border-radius:22px;overflow:hidden;background:#fff;cursor:pointer;padding:0;aspect-ratio:.78}
.avatar-card img{width:100%;height:100%;display:block;object-fit:cover;object-position:center}
.avatar-card span{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(14,16,32,.72);color:#fff;border-radius:10px;padding:7px;font-weight:900;text-align:center;font-size:13px}
.avatar-card.selected{border-color:var(--accent);transform:translateY(-3px)}
.variant-grid{display:grid;grid-template-columns:repeat(2,minmax(220px,320px));justify-content:center;gap:22px}
.variant-card{border:4px solid transparent;border-radius:24px;overflow:hidden;background:#fff;cursor:pointer;padding:0;box-shadow:0 8px 24px rgba(20,20,40,.09)}
.variant-card img{width:100%;aspect-ratio:.82;object-fit:cover;object-position:center;display:block}
.variant-card strong{display:block;padding:12px;font-size:18px}
.variant-card.selected{border-color:var(--accent)}
.player{display:flex;align-items:center;gap:12px;padding:10px;border-bottom:1px solid var(--border)}
.face{width:52px;height:52px;border-radius:14px;overflow:hidden;background:#eee;flex:none}
.face img{width:100%;height:100%;object-fit:cover}
.answer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.answer{border:3px solid var(--border);border-radius:20px;padding:20px;background:#fff;min-height:92px;text-align:left;font-weight:900;font-size:20px;cursor:pointer}
.answer.correct{border-color:var(--ok);background:#ecfdf3}
.answer.wrong{opacity:.45}
.rank-row{display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--border)}
.timer{font-size:34px;font-weight:900}
input.text{width:100%;padding:13px 14px;border:2px solid var(--border);border-radius:14px;text-transform:uppercase}
.hidden{display:none!important}
.preview-list{max-height:36vh;overflow:auto}
.preview-list button{width:100%;margin-bottom:8px;text-align:left}
.wait-avatar{width:220px;aspect-ratio:.82;border-radius:26px;overflow:hidden;margin:0 auto 18px;border:5px solid var(--accent)}
.wait-avatar img{width:100%;height:100%;object-fit:cover}
@media(max-width:900px){.answer-grid{grid-template-columns:1fr}
  .screen{padding:18px;justify-content:flex-start}
  .avatar-grid{grid-template-columns:repeat(3,1fr)}
  .grid3{grid-template-columns:1fr}
  .variant-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
  .grid2{grid-template-columns:1fr}
  .avatar-grid{grid-template-columns:repeat(2,1fr)}
  .big{font-size:28px}
}

.session-card{cursor:pointer;min-height:150px;position:relative}
.session-card.active-session{border-color:var(--accent);background:#f0edff}
.session-card.soon{opacity:.62;cursor:default}
.session-number{font-size:13px;font-weight:900;color:var(--accent);letter-spacing:.05em}

.answer.option-0{background:#ffe8e8;border-color:#e75a5a}
.answer.option-1{background:#e6f1ff;border-color:#4f8fe8}
.answer.option-2{background:#fff4cf;border-color:#e0ad27}
.answer.option-3{background:#e8f7e8;border-color:#55a95a}
.answer.option-0:hover,.answer.option-1:hover,.answer.option-2:hover,.answer.option-3:hover{filter:brightness(.98)}
.answer.correct{border-color:var(--ok)!important;background:#dcfce7!important;opacity:1!important}
.answer.wrong{opacity:.42}
.question-preview{padding:14px 16px;border:2px solid var(--border);border-radius:16px;background:#fff;margin-bottom:10px}
.question-preview b{display:block;margin-bottom:6px}


.question-visual{margin:16px auto 4px;max-width:720px;padding:18px;border:2px solid var(--border);border-radius:22px;background:linear-gradient(135deg,#fffaf0,#f5f3ff);text-align:center}
.visual-stage{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;font-size:54px}
.visual-paper{width:190px;height:44px;border-radius:10px;background:#fff;border:3px solid #a7a7a7;box-shadow:0 8px 14px rgba(0,0,0,.08);position:relative}
.visual-glass{font-size:58px;line-height:1;position:absolute;left:50%;top:-52px;transform:translateX(-50%)}
.visual-arrow{font-size:48px;font-weight:900;color:var(--accent)}
.type-badge{display:inline-block;padding:6px 10px;border-radius:999px;font-weight:900;font-size:12px;background:#ece9ff;color:#4438ca;margin-bottom:10px}
.type-vf{background:#e9f8ed;color:#166534}.type-image{background:#eaf3ff;color:#1d4ed8}.type-match{background:#fff1db;color:#9a4f00}
.match-grid{display:grid;grid-template-columns:minmax(110px,.8fr) 1.4fr;gap:10px 14px;align-items:center;margin-top:16px}
.match-left{font-weight:900;padding:14px;border-radius:14px;background:#f5f3ff;border:2px solid #d7d2ff}
.match-select{width:100%;padding:13px;border:2px solid var(--border);border-radius:14px;background:#fff;font-weight:800;color:var(--text)}
.match-solution{display:grid;gap:8px;margin-top:12px}.match-solution div{padding:10px 12px;border-radius:12px;background:#ecfdf3;border:2px solid #86efac;font-weight:900}
@media(max-width:600px){.match-grid{grid-template-columns:1fr}.visual-stage{font-size:42px}.visual-paper{width:150px}}


.question-visual{margin:16px auto 4px;max-width:760px;padding:12px;border:2px solid var(--border);border-radius:22px;background:linear-gradient(135deg,#fffaf0,#f5f3ff);text-align:center;overflow:hidden}
.question-visual img{display:block;width:100%;max-height:310px;object-fit:contain;border-radius:16px;background:#fff}
.answer.vf-true{background:#16a34a!important;color:#fff;border-color:#15803d!important;text-align:center}
.answer.vf-false{background:#dc2626!important;color:#fff;border-color:#b91c1c!important;text-align:center}
.answer.vf-true.correct,.answer.vf-false.correct{outline:5px solid #fde047;opacity:1}
.answer.vf-true.wrong,.answer.vf-false.wrong{opacity:.38}
.match-board{display:grid!important;grid-template-columns:1fr 1fr!important;gap:14px;margin-top:16px;align-items:start}
.match-column{display:grid;gap:12px}
.match-column-title{text-align:center;font-weight:900;color:var(--accent);font-size:13px}
.drag-item,.drop-zone{min-height:92px;border-radius:18px;border:3px solid var(--border);padding:12px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;touch-action:none;user-select:none}
.drag-item{background:#fff;cursor:grab;gap:10px;box-shadow:0 5px 14px rgba(20,20,40,.08)}
.drag-item .drag-icon{font-size:34px;line-height:1}
.drop-zone{background:#faf8ff;border-style:dashed;border-color:#b8afea;color:#3f3a57}
.drop-zone.over{background:#eeeaff;border-color:var(--accent);transform:scale(1.02)}
.drop-zone.filled{padding:5px}.drop-zone.filled .drop-label{display:none}
.drag-ghost{position:fixed;z-index:9999;pointer-events:none;opacity:.92;transform:translate(-50%,-50%) scale(1.04);width:min(42vw,330px)}
.match-submit{grid-column:1/-1}
@media(max-width:600px){.question-visual img{max-height:230px}.match-board{gap:8px}.drag-item,.drop-zone{min-height:105px;padding:8px;font-size:13px}.drag-item{flex-direction:column;gap:5px}.drag-item .drag-icon{font-size:30px}}


/* ===== V0.5.3 ===== */
#studentQuestion.screen.active,#question.screen.active{
  justify-content:flex-start;
  padding-top:12px;
  padding-bottom:12px;
}
#studentQuestion .inner,#question .inner{width:min(1180px,100%)}
#studentQuestion .hero,#question .hero{
  padding:14px 18px!important;
  margin-top:10px!important;
}
#studentQuestionText,#questionText{
  margin:5px 0!important;
  font-size:clamp(23px,3vw,38px)!important;
  line-height:1.08!important;
}
#studentAnswers,#answers{margin-top:12px!important}
.question-visual{
  margin:8px auto!important;
  padding:6px!important;
  max-width:650px!important;
}
.question-visual img{
  max-height:215px!important;
  object-fit:contain!important;
}
.answer-grid.vf-grid{
  grid-template-columns:repeat(2,minmax(240px,340px))!important;
  justify-content:center!important;
  gap:20px!important;
  max-width:760px;
  margin-left:auto!important;
  margin-right:auto!important;
}
.answer-grid.vf-grid .answer{
  text-align:center!important;
  min-height:100px!important;
  font-size:22px!important;
}
.answer-grid.visual-two-grid{
  grid-template-columns:repeat(2,minmax(260px,1fr))!important;
  gap:18px!important;
  max-width:900px;
  margin-left:auto!important;
  margin-right:auto!important;
}
.visual-choice{
  background:#fff!important;
  border:4px solid var(--border)!important;
  border-radius:20px!important;
  padding:10px!important;
  min-height:245px!important;
  display:flex!important;
  flex-direction:column;
  justify-content:space-between;
  align-items:stretch;
  text-align:center!important;
}
.visual-choice img{
  width:100%;
  height:175px;
  object-fit:contain;
  border-radius:14px;
  background:#fff;
}
.visual-choice-label{
  margin-top:8px;
  font-size:19px;
  font-weight:900;
}
.visual-choice.selected{
  border-color:var(--accent)!important;
  box-shadow:0 0 0 4px rgba(91,76,224,.16);
  transform:translateY(-2px);
}
.visual-send{
  width:min(520px,100%);
  margin:12px auto 0!important;
  display:block;
  font-size:21px;
}
#question .card.row{
  margin-top:12px!important;
  padding:12px 16px!important;
}
@media(max-width:700px){
  #studentQuestionText,#questionText{font-size:clamp(21px,5.8vw,30px)!important}
